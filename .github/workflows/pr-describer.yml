name: "PR Describer"
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    runs-on: [self-hosted, nixos]
    strategy:
      fail-fast: false
      matrix:
        target: [jester, alicia]
    steps:
    - uses: actions/checkout@v4

    - name: Nix derivation diff
      id: nix_diff
      run: |
        base="github:${{ github.repository }}/${{ github.base_ref }}#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel"
        head=".#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel"
        diff=$(nix --extra-experimental-features 'nix-command flakes' \
          store diff-closures "$base" "$head" 2>&1 || echo "diff-closures failed; see job logs.")
        {
          echo "diff<<__NIX_DIFF_EOF__"
          echo "$diff"
          echo "__NIX_DIFF_EOF__"
        } >> "$GITHUB_OUTPUT"
      env:
        NIX_CONFIG: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          substituters = https://cache.nixos.org/
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

    - name: Comment report in PR
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: pr-describer-${{ matrix.target }}
        message: |
          ### Closure diff for `${{ matrix.target }}`
          <details>
          <summary>Version changes</summary>

          ```
          ${{ steps.nix_diff.outputs.diff }}
          ```
          </details>
