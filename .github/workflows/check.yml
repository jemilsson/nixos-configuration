name: "Flake Check (hosted)"
on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    # GitHub-hosted runner. Runs the hermetic flake checks (e.g. jester-retry-body)
    # WITHOUT the self-hosted runner or the private ssh:// inputs (fafnir/syna).
    # This is the fast gate that runs on every push/PR regardless of self-hosted
    # runner availability. jester is the only machine left and it genuinely
    # requires the private inputs, so it cannot be evaluated here; its full build
    # lives in build-test.yml on [self-hosted]. There are no public-input machines
    # left to eval, so the per-machine eval step was removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run hermetic checks
        run: |
          nix --extra-experimental-features 'nix-command flakes' build \
            --no-link --print-build-logs \
            '.#checks.x86_64-linux.jester-retry-body'
